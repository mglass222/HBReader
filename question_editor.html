<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Database Editor</title>
    <link rel="stylesheet" href="src/styles/question-editor.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-text">Loading questions...</div>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="search-section">
                <h2>Question Database Editor</h2>
                <input type="text" class="search-input" id="searchInput" placeholder="Search questions or answers...">
                <div class="filter-row">
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="preliminary">Preliminary</option>
                        <option value="quarterfinals">Quarterfinals</option>
                        <option value="semifinals">Semifinals</option>
                        <option value="finals">Finals</option>
                    </select>
                    <select id="regionFilter">
                        <option value="">All Regions</option>
                    </select>
                </div>
                <div class="filter-row">
                    <select id="periodFilter">
                        <option value="">All Time Periods</option>
                    </select>
                    <select id="typeFilter">
                        <option value="">All Answer Types</option>
                    </select>
                </div>
                <div class="stats" id="stats">Loading...</div>
            </div>
            <div class="question-list" id="questionList"></div>
        </div>

        <!-- Editor -->
        <div class="editor">
            <div class="editor-header">
                <h1>
                    <span id="editorTitle">Select a question to edit</span>
                    <span class="modified-indicator hidden" id="modifiedIndicator" title="Unsaved changes"></span>
                </h1>
                <div class="button-group">
                    <button class="btn btn-secondary" id="revertBtn" disabled>Revert Changes</button>
                    <button class="btn btn-primary" id="saveBtn" disabled>Save Changes</button>
                </div>
            </div>
            <div class="editor-content" id="editorContent">
                <div class="no-selection" id="noSelection">
                    Select a question from the list to edit
                </div>
                <div class="hidden" id="editForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Question ID</label>
                            <input type="text" id="questionId" readonly>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="questionCategory">
                                <option value="preliminary">Preliminary</option>
                                <option value="quarterfinals">Quarterfinals</option>
                                <option value="semifinals">Semifinals</option>
                                <option value="finals">Finals</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Question Text</label>
                        <textarea id="questionText" rows="5"></textarea>
                        <div class="html-hint">HTML supported: &lt;strong&gt;, &lt;em&gt;, &lt;u&gt;</div>
                    </div>

                    <div class="form-group">
                        <label>Answer</label>
                        <textarea id="answerText" rows="3"></textarea>
                        <div class="html-hint">HTML supported: &lt;strong&gt;, &lt;em&gt;, &lt;u&gt;</div>
                    </div>

                    <div class="preview-section">
                        <h4>Question Preview</h4>
                        <div class="preview-content" id="questionPreview"></div>
                    </div>

                    <div class="preview-section">
                        <h4>Answer Preview</h4>
                        <div class="preview-content" id="answerPreview"></div>
                    </div>

                    <h3 class="section-title">Metadata</h3>

                    <div class="form-group">
                        <label>Regions</label>
                        <div class="checkbox-group" id="regionsGroup"></div>
                    </div>

                    <div class="form-group">
                        <label>Time Periods</label>
                        <div class="checkbox-group" id="periodsGroup"></div>
                    </div>

                    <div class="form-group">
                        <label>Answer Type</label>
                        <select id="answerType">
                            <option value="">Select...</option>
                            <option value="People & Biography">People & Biography</option>
                            <option value="Events (Wars, Battles, Revolutions)">Events (Wars, Battles, Revolutions)</option>
                            <option value="Political History & Diplomacy">Political History & Diplomacy</option>
                            <option value="Economic History & Trade">Economic History & Trade</option>
                            <option value="Social History & Daily Life">Social History & Daily Life</option>
                            <option value="Cultural History (Art, Literature, Music)">Cultural History (Art, Literature, Music)</option>
                            <option value="Religion & Mythology">Religion & Mythology</option>
                            <option value="Science, Technology & Innovation">Science, Technology & Innovation</option>
                            <option value="Geography & Environment">Geography & Environment</option>
                            <option value="Places, Cities & Civilizations">Places, Cities & Civilizations</option>
                            <option value="Groups, Organizations & Institutions">Groups, Organizations & Institutions</option>
                            <option value="Documents, Laws & Treaties">Documents, Laws & Treaties</option>
                            <option value="Ideas, Ideologies & Philosophies">Ideas, Ideologies & Philosophies</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Subject Themes</label>
                        <div class="checkbox-group" id="themesGroup"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/js/questionEditor.js"></script>
</body>
</html>
